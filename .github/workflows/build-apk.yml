
name: KALVO 7.2.0 Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kalvo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source, tests and Android configuration
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run full regression suite
        run: python -m pytest -q

      - name: Run unittest compatibility suite
        run: python -m unittest discover -s tests -q

      - name: Compile Python sources
        run: python -m compileall -q main.py apex services tests tools

      - name: Validate KALVO Android package configuration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import configparser
          import struct
          from pathlib import Path

          spec = configparser.ConfigParser(interpolation=None)
          if not spec.read('buildozer.spec', encoding='utf-8'):
              raise SystemExit('buildozer.spec is missing or unreadable')

          expected = {
              ('app', 'title'): 'KALVO',
              ('app', 'package.name'): 'kalvomax',
              ('app', 'package.domain'): 'org.kalvo.lab',
              ('app', 'version'): '7.2.0',
              ('app', 'icon.filename'): '%(source.dir)s/assets/kalvo_icon.png',
              ('app', 'android.archs'): 'arm64-v8a',
              ('app', 'android.api'): '33',
              ('app', 'android.minapi'): '24',
          }

          for (section, key), wanted in expected.items():
              if not spec.has_option(section, key):
                  raise SystemExit(f'Missing [{section}] {key}')

              actual = spec.get(section, key, raw=True).strip()
              if actual != wanted:
                  raise SystemExit(
                      f'Unexpected [{section}] {key}: {actual!r}; expected {wanted!r}'
                  )

          icon = Path('assets/kalvo_icon.png')
          if not icon.is_file():
              raise SystemExit('Launcher icon is missing')

          image = icon.read_bytes()
          if len(image) < 1024 or image[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Launcher icon is not a valid PNG')

          width, height = struct.unpack('>II', image[16:24])
          if (width, height) != (512, 512):
              raise SystemExit(
                  f'Expected 512x512 app icon, got {width}x{height}'
              )

          required_files = [
              'main.py',
              'requirements.txt',
              'apex',
              'services/kalvo_monitor.py',
              'assets/sfx/tap.wav',
              'assets/sfx/success.wav',
              'assets/sfx/alert.wav',
          ]

          missing = [
              name for name in required_files
              if not Path(name).exists()
          ]

          if missing:
              raise SystemExit(
                  'Missing required files: ' + ', '.join(missing)
              )

          if not spec.has_option('app', 'services'):
              raise SystemExit('Android background service is not declared')

          service = spec.get('app', 'services', raw=True).strip()

          if service != 'kalvomonitor:services/kalvo_monitor.py:foreground:sticky':
              raise SystemExit(
                  f'Unexpected Android service declaration: {service!r}'
              )

          extensions = set(
              spec.get('app', 'source.include_exts', raw=True).split(',')
          )

          if 'wav' not in extensions:
              raise SystemExit(
                  'WAV sound effects are excluded from Android packaging'
              )

          requirements = spec.get('app', 'requirements', raw=True)

          for package in (
              'arabic-reshaper==3.0.0',
              'python-bidi==0.4.2',
              'pyjnius',
          ):
              if package not in requirements:
                  raise SystemExit(
                      f'Missing Android build requirement: {package}'
                  )

          service_source = Path(
              'services/kalvo_monitor.py'
          ).read_text(encoding='utf-8')

          if 'monitor_loop' not in service_source or 'paper_only' not in service_source:
              raise SystemExit(
                  'Background service entry point failed static safety check'
              )

          print(
              'KALVO 7.2.0 source, icon, sounds and Android service validated.'
          )
          PY

  build:
    name: Build installable Android debug APK
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      BUILDOZER_WARN_ON_ROOT: '0'
      ANDROID_ACCEPT_SDK_LICENSE: '1'
      APP_ANDROID_ACCEPT_SDK_LICENSE: '1'
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
      P4A_RELEASE: '0'

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Android build system packages
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ant autoconf automake autopoint build-essential ccache cmake gettext \
            git lbzip2 libbz2-dev libffi-dev libjpeg-dev libltdl-dev liblzma-dev \
            libncurses5-dev libncursesw5-dev libpng-dev libsqlite3-dev libssl-dev \
            libtinfo5 libtool make openjdk-17-jdk patch pkg-config unzip wget zip \
            zlib1g-dev

      - name: Restore Buildozer and Android SDK cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-kalvo-7.2.0-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-kalvo-7.2.0-
            ${{ runner.os }}-kalvo-

      - name: Install pinned Python Android toolchain
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip setuptools wheel virtualenv

          python -m pip install \
            'buildozer==1.5.0' \
            'Cython==0.29.36'

          buildozer --version
          cython --version

      - name: Build KALVO 7.2.0 debug APK
        run: buildozer -v android debug

      - name: Verify APK and write SHA-256 metadata
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t APKS < <(
            find bin -maxdepth 1 -type f -name '*.apk' -print | sort
          )

          if [[ ${#APKS[@]} -ne 1 ]]; then
            echo "Expected exactly one APK in bin/, found ${#APKS[@]}"
            find bin -maxdepth 1 -type f -print || true
            exit 1
          fi

          mkdir -p build-metadata

          sha256sum "${APKS[0]}" | tee build-metadata/SHA256SUMS.txt

          cp buildozer.spec build-metadata/buildozer.spec

          printf '%s\n' \
            'Application: KALVO' \
            'Version: 7.2.0' \
            'Package: org.kalvo.lab.kalvomax' \
            'Artifact: Debug APK (not Play Store release-signed)' \
            'Trading: local paper/simulation ledger only' \
            'Background service: best-effort Android foreground service' \
            > build-metadata/BUILD_INFO.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          name: KALVO-7.2.0-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build metadata
        uses: actions/upload-artifact@v7
        with:
          name: KALVO-7.2.0-Build-Info
          path: build-metadata/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: KALVO-7.2.0-Build-Diagnostics
          path: |
            .buildozer/android/platform/build-*/
            .buildozer/android/platform/python-for-android/
            buildozer.spec
          if-no-files-found: ignore
          retention-days: 7
